<svg xmlns="http://www.w3.org/2000/svg" width="428" height="190" viewBox="0 0 428 190" role="img" aria-label="Répartition de l'activité : 32 commits, 22 pull requests, 4 issues.">
  <title>ACTIVITY MIX</title>
