<svg xmlns="http://www.w3.org/2000/svg" width="870" height="212" viewBox="0 0 870 212" role="img" aria-label="Carte perforée : quand tombent les 140 derniers événements publics, par jour de la semaine et par heure.">
  <title>PUNCH CARD</title>
  <desc>Chaque disque dit combien d'événements publics sont tombés ce jour-là à cette heure-là, sur les 140 derniers (2026-10-05 → 2026-10-19), heure de Paris. Le plus gros en vaut 27. Source : API GraphQL de GitHub, arrêté au 2026-10-25 15:54Z. Dépôts publics seulement, lus en agrégat : ni nom, ni contenu, ni description.</desc>
