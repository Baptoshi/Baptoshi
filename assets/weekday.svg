<svg xmlns="http://www.w3.org/2000/svg" width="428" height="190" viewBox="0 0 428 190" role="img" aria-label="Profil hebdomadaire : MON 21, TUE 11, WED 0, THU 1, FRI 12, SAT 0, SUN 33.">
  <title>WEEKDAY PROFILE</title>
  <desc>Ce que pèse chaque jour de la semaine sur douze mois : mon 21, tue 11, wed 0, thu 1, fri 12, sat 0, sun 33. Source : API GraphQL de GitHub, arrêté au 2026-10-11 21:57Z. Dépôts publics seulement, lus en agrégat : ni nom, ni contenu, ni description.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c805"/><stop offset="1" stop-color="#00c805" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c805" stop-opacity=".32"/><stop offset="1" stop-color="#00c805" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dffa0" stop-opacity="0"/><stop offset=".45" stop-color="#8dffa0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#8dffa0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono, .big, .val, .num { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
      .tick { font-size: 13px; fill: #fff; font-weight: 600; letter-spacing: 1.4px; }
      .sub  { font-size: 10.5px; fill: #6d7279; letter-spacing: 1.2px; }
      .sec  { font-size: 10px; fill: #e8eaed; letter-spacing: 1.8px; font-weight: 600; }
      .lab  { font-size: 9.5px; fill: #6d7279; letter-spacing: 1.5px; }
      .tiny { font-size: 8.5px; fill: #5d6268; letter-spacing: 1.1px; }
      .big  { font-size: 44px; fill: #fff; font-weight: 500; letter-spacing: -1.4px; }
      .chg  { font-size: 12.5px; fill: #00c805; font-weight: 600; }
      .key  { font-size: 9.5px; fill: #8b9199; letter-spacing: 1.3px; }
      .val  { font-size: 16px; fill: #fff; font-weight: 500; }
      .num  { font-size: 11px; fill: #c9ced4; }
      .leg  { font-size: 10px; fill: #a7adb4; letter-spacing: .6px; }
      .foot { font-size: 9px; fill: #5d6268; letter-spacing: 1.1px; }
      .live { font-size: 9.5px; fill: #00c805; letter-spacing: 1.6px; font-weight: 600; }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      .ping  { animation: ping 2.6s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes ping { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(3.4); } }
      .cellule { animation: cellule 6s ease-in-out infinite alternate; }
      @keyframes cellule { from { opacity: .5; } to { opacity: 1; } }
      .grow  { animation: grow 5.5s ease-in-out infinite alternate; }
      @keyframes grow { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .ping, .cellule, .grow, .scan, .trace, .gloss, .spin, .sheen { animation: none; }
        .ping, .scan, .trace, .gloss, .sheen { opacity: 0; }
      }
    </style>
  </defs>
  <rect width="428" height="190" rx="12" fill="#0a0a0b"/>
  <rect x=".5" y=".5" width="427" height="189" rx="11.5" fill="none" stroke="#1a1c1f"/>
  <text x="20" y="28" class="sec">WEEKDAY PROFILE</text>
  <text x="408" y="28" class="lab" text-anchor="end">12M</text>
  <line x1="0" y1="42" x2="428" y2="42" stroke="#1a1c1f"/>
  <line x1="20" y1="148" x2="408" y2="148" stroke="#2a2d32"/>
  <g>
    <rect class="grow" x="27.0" y="100.9" width="41.4" height="47.1" rx="2" fill="#17622b" style="animation-delay:0s"/>
    <text x="47.7" y="162" class="tiny" text-anchor="middle">MON</text>
    <text x="47.7" y="94.9" class="tiny" text-anchor="middle">21</text>
  </g>
  <g>
    <rect class="grow" x="82.4" y="123.3" width="41.4" height="24.7" rx="2" fill="#17622b" style="animation-delay:0.3s"/>
    <text x="103.1" y="162" class="tiny" text-anchor="middle">TUE</text>
    <text x="103.1" y="117.3" class="tiny" text-anchor="middle">11</text>
  </g>
  <g>
    <rect class="grow" x="137.9" y="146.0" width="41.4" height="2.0" rx="2" fill="#17622b" style="animation-delay:0.6s"/>
    <text x="158.6" y="162" class="tiny" text-anchor="middle">WED</text>
    <text x="158.6" y="140.0" class="tiny" text-anchor="middle">0</text>
  </g>
  <g>
    <rect class="grow" x="193.3" y="145.0" width="41.4" height="3.0" rx="2" fill="#17622b" style="animation-delay:0.8999999999999999s"/>
    <text x="214.0" y="162" class="tiny" text-anchor="middle">THU</text>
    <text x="214.0" y="139.0" class="tiny" text-anchor="middle">1</text>
  </g>
  <g>
    <rect class="grow" x="248.7" y="121.1" width="41.4" height="26.9" rx="2" fill="#17622b" style="animation-delay:1.2s"/>
    <text x="269.4" y="162" class="tiny" text-anchor="middle">FRI</text>
    <text x="269.4" y="115.1" class="tiny" text-anchor="middle">12</text>
  </g>
  <g>
    <rect class="grow" x="304.1" y="146.0" width="41.4" height="2.0" rx="2" fill="#17622b" style="animation-delay:1.5s"/>
    <text x="324.9" y="162" class="tiny" text-anchor="middle">SAT</text>
    <text x="324.9" y="140.0" class="tiny" text-anchor="middle">0</text>
  </g>
  <g>
    <rect class="grow" x="359.6" y="74.0" width="41.4" height="74.0" rx="2" fill="#00c805" style="animation-delay:1.7999999999999998s"/>
    <text x="380.3" y="162" class="tiny" text-anchor="middle">SUN</text>
    <text x="380.3" y="68.0" class="tiny" text-anchor="middle">33</text>
  </g>
  <text x="20" y="180" class="foot">BUSIEST SUN · 33 CONTRIBUTIONS</text>
</svg>
