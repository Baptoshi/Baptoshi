  <line x1="214" y1="122" x2="188.8" y2="174.3" stroke="#1a1d21"/>
  <line x1="214" y1="122" x2="157.5" y2="134.9" stroke="#1a1d21"/>
  <line x1="214" y1="122" x2="168.7" y2="85.8" stroke="#1a1d21"/>
  <g class="sweep"><path d="M214 122 L214 64 A58 58 0 0 1 265.7 95.7 Z" fill="url(#beam)"/>
    <line x1="214" y1="122" x2="214" y2="64" stroke="#4dec6a" stroke-width="1" opacity=".7"/></g>
  <polygon points="214.0,64.0 242.0,99.7 231.8,126.1 220.0,134.4 206.6,137.3 195.0,126.3 195.2,107.0" fill="#00c805" fill-opacity=".22" stroke="#00c805" stroke-width="1.8" stroke-linejoin="round"/>
  <circle class="vtx" cx="214.0" cy="64.0" r="2.6" fill="#4dec6a" style="animation-delay:0s"/>
  <circle class="vtx" cx="242.0" cy="99.7" r="2.6" fill="#00c805" style="animation-delay:0.25s"/>
  <circle class="vtx" cx="231.8" cy="126.1" r="2.6" fill="#00c805" style="animation-delay:0.5s"/>
  <circle class="vtx" cx="220.0" cy="134.4" r="2.6" fill="#00c805" style="animation-delay:0.75s"/>
  <circle class="vtx" cx="206.6" cy="137.3" r="2.6" fill="#00c805" style="animation-delay:1s"/>
